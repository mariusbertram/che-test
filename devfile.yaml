schemaVersion: 2.2.0
metadata:
  name: dev-environment
  displayName: Go, Python, Ansible & Terraform Dev Environment
  description: >-
    OpenShift Dev Spaces workspace for Go, Python, Ansible and Terraform
    development. Pre-configured for corporate HTTP(S) proxies and for
    remote JetBrains IDEs via JetBrains Gateway.
  tags:
    - Go
    - Python
    - Ansible
    - Terraform
    - JetBrains

components:
  - name: tools
    container:
      # Custom image built from .devspaces/Dockerfile by
      # .github/workflows/build-dev-image.yml (GitHub Actions -> GHCR).
      # Extends the devfile "Universal Developer Image" (Go, Python3/pip,
      # Terraform, git, ... already included) with Ansible baked in, so
      # nothing needs to be installed when the workspace starts.
      image: ghcr.io/mariusbertram/che-test-dev:latest
      # Sized for toolchain + a full JetBrains Gateway/Ultimate backend
      # running in the same container (Community's Projector footprint was
      # much smaller; Ultimate needs real headroom).
      memoryLimit: 8Gi
      memoryRequest: 1Gi
      cpuLimit: '4'
      cpuRequest: '1'
      mountSources: true
      env:
        # --- Corporate proxy ---
        # Fill in your proxy URL (e.g. http://proxy.example.corp:3128).
        # Leave empty if your cluster's CheCluster already injects a
        # cluster-wide proxy into workspace pods - in that case these
        # values are only needed for extra NO_PROXY entries.
        - name: HTTP_PROXY
          value: ''
        - name: HTTPS_PROXY
          value: ''
        - name: NO_PROXY
          value: 'localhost,127.0.0.1,.svc,.cluster.local'
        - name: http_proxy
          value: ''
        - name: https_proxy
          value: ''
        - name: no_proxy
          value: 'localhost,127.0.0.1,.svc,.cluster.local'
        # --- Go ---
        - name: GOPATH
          value: /home/user/go
        - name: GOPROXY
          value: 'https://proxy.golang.org,direct'
        - name: GOSUMDB
          value: sum.golang.org
        # --- Python / pip ---
        - name: PIP_DEFAULT_TIMEOUT
          value: '100'

commands:
  - id: configure-proxy
    exec:
      component: tools
      label: 'Configure proxy for git/pip'
      workingDir: ${PROJECT_SOURCE}
      commandLine: bash "${PROJECT_SOURCE}/.devspaces/configure-proxy.sh"

events:
  postStart:
    - configure-proxy
