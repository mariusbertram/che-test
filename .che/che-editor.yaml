# Default (browser) editor when this repo is opened in OpenShift Dev Spaces.
#
# We deliberately do NOT default to che-idea (IntelliJ IDEA Community) here:
# it cannot run the Go plugin (Ultimate/GoLand-only) and this workspace is
# meant to always be driven via IntelliJ IDEA Ultimate over JetBrains
# Gateway instead (see README.md, section "Remote JetBrains-IDE (Ultimate)").
# che-code just needs to be running so Gateway has something to attach to;
# it is not what you actually develop in day to day.
id: che-incubator/che-code/latest
